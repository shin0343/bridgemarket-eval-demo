# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# 채점기 확인용 세트: 공통 사례 여섯 건. 일부러 넣은 실패(R13)가 있으므로, 이 실행은 실패 1건으로 끝나는 것이 정상입니다.
# 모델을 부르지 않습니다. echo 제공자는 프롬프트로 받은 글자를 그대로 답으로 돌려줍니다 = 저장된 답을 채점합니다.
description: 브릿지마켓 · 옛 정책을 현행처럼 안내했나 (채점기 확인용 6건)

prompts:
  - "{{reply}}"

providers:
  - id: echo
    label: 저장된 답

tests: file://load_cases.py:generate_tests

defaultTest:
  assert:
    - type: python
      value: file://assert_policy.py
      metric: old_policy_as_current

outputPath: results/check.json
