# 예시: PR마다 Promptfoo 회귀 검사 (.github/workflows/ 로 복사해서 씁니다)
# 모델을 부르지 않습니다. 후보 응답(ci/candidates.json)을 섹션 2 기준으로 채점합니다.
# 실패가 하나라도 있으면 promptfoo 가 0이 아닌 종료 코드로 끝나고, 이 검사가 실패로 표시됩니다.
# PR 병합까지 막으려면 저장소 설정의 브랜치 보호 규칙에서 이 검사를 필수 상태 검사로 지정합니다.
name: eval-gate
on: [pull_request]
jobs:
  old-policy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: practice/s09_tools/promptfoo
    env:
      PROMPTFOO_DISABLE_TELEMETRY: "1"
      PROMPTFOO_DISABLE_UPDATE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Promptfoo 설치 (package-lock.json 의 0.125.1)
        run: npm ci
      - name: 회귀 검사 · 옛 정책을 현행처럼 안내했나 (API 호출 없음)
        run: npx promptfoo eval -c ci/promptfooconfig.yaml --no-cache --no-table
